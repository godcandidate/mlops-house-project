version: "3"
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5555:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /tmp/mlruns
    container_name: mlflow-tracking-server
    volumes:
      - ./mlflow-data:/mlflow
      - ./mlruns:/tmp/mlruns

  zenml:
    image: zenmldocker/zenml-server
    ports:
      - "8000:8080"
    container_name: zenml-server
    volumes:
      - ./zenml-data:/data
